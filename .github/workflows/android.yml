name: Build Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle assembleDirectRelease bundlePlayRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-direct-apk
          path: app/build/outputs/apk/direct/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-play-aab
          path: app/build/outputs/bundle/playRelease/*.aab
